version: "1.0"
universe_name: "Indian_Qualitatively_Sensitive_Universe"
effective_date: "2026-09-20"

tiers:
  tier_1:
    description: "Large-cap liquid benchmark (Nifty 100)"
    min_market_cap_inr: 250000000000  # 25,000 Cr
    min_adt20_inr: 50000000           # 5 Cr daily turnover
    max_position_nav_pct: 3.0
  tier_2:
    description: "Mid-cap growth universe (Nifty Midcap 150)"
    min_market_cap_inr: 75000000000   # 7,500 Cr
    min_adt20_inr: 20000000           # 2 Cr daily turnover
    max_position_nav_pct: 2.0
  tier_3:
    description: "Small-cap quality universe (Nifty Smallcap 250)"
    min_market_cap_inr: 20000000000   # 2,000 Cr
    min_adt20_inr: 10000000           # 1 Cr daily turnover
    max_position_nav_pct: 1.5
  tier_4:
    description: "Micro-cap event-sensitive eligible universe"
    min_market_cap_inr: 5000000000    # 500 Cr
    min_adt20_inr: 5000000            # 50 Lakhs daily turnover
    max_position_nav_pct: 1.0

constraints:
  maximum_sector_nav_pct: 20.0
  maximum_single_archetype_nav_pct: 40.0
  maximum_adv_participation_pct: 5.0
  exclude_asm_esm: true
  exclude_delisted_or_suspended: true
