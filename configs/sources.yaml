# §27.2 Source configuration — all 19 required fields per source
# Exact field names as specified in Version 6.0 artifact §27.2.
# Adapter cannot run if terms_url, base_url, cursor_type,
# required_fields, or health range are absent.

sources:
  exchange:
    source_id: S1_EXCHANGE
    enabled: true
    mode: PAPER_SIGNAL
    adapter_class: qual_event_engine.sources.exchange.ExchangeAdapter
    base_url: https://www.nseindia.com/companies-listing/corporate-filings-announcements
    terms_url: https://www.nseindia.com/terms-of-use
    polling_schedule: "45 23 * * 1-5"
    request_timeout_seconds: 30
    max_retries: 3
    backoff_seconds: 5
    rate_limit_per_minute: 30
    cursor_type: timestamp
    required_fields:
      - source_native_id
      - source_published_at_utc
      - source_url
      - raw_sha256
    document_types:
      - application/pdf
      - text/html
    entity_requirement: MANDATORY
    publication_time_field: source_published_at_utc
    health_min_count: 5
    health_max_count: 5000
    archive_retention_days: 3650

