sources:
  exchange:
    enabled: true
    mode: PAPER_SIGNAL
    input_contract: manifest.jsonl
    base_url: https://www.nseindia.com/companies-listing/corporate-filings-announcements
    terms_url: https://www.nseindia.com/terms-of-use
    cursor_strategy: timestamp
    health_bounds:
      min_daily_records: 5
      max_daily_records: 5000
      max_failure_rate: 0.02
